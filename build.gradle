plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { necromancy { source sourceSets.main } }
        }
        server { args 'nogui' }
    }
}

repositories { mavenCentral() }

dependencies { minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}" }

jar {
    manifest {
        attributes([
            'Specification-Title': 'Necromancy',
            'Specification-Vendor': 'Sparklingspace Tangerine Star',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Sparklingspace Tangerine Star'
        ])
    }
}

publishing { publications { register('mavenJava', MavenPublication) { from components.java } } }
